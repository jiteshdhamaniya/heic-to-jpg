<!-- index.html -->

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'" />
    <title>HEIC to JPG Converter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>HEIC to JPG Converter</h1>
    <p>Convert locally. Your originals stay untouched; existing JPGs are never replaced.</p>
    <button id="choose-files" type="button">Choose HEIC files…</button>
    <div id="drop-zone" aria-busy="false">Drag and drop HEIC files here</div>
    <p id="summary" role="status" aria-live="polite">JPGs will be saved in the same folder as the HEIC files.</p>
    <ul id="file-list"></ul>

    <script src="renderer.js"></script>
  </body>
</html>

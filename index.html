<!-- index.html -->

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>HEIC to JPG Converter By Jitesh dhamaniya</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 50px;
      }
      #drop-zone {
        width: 100%;
        height: 200px;
        border: 2px dashed #ccc;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #aaa;
        font-size: 24px;
        margin-top: 20px;
        margin-bottom: 20px;
      }
      #file-list {
        list-style-type: none;
        padding: 0;
        max-width: 600px;
        margin: 0 auto;
        text-align: left;
      }
      #file-list li {
        padding: 10px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #file-list li .file-name {
        flex: 1;
      }
      #file-list li .file-status {
        margin-left: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>HEIC to JPG Converter</h1>
    <div id="drop-zone">Drag and drop HEIC files here</div>
    <ul id="file-list"></ul>

    <script src="renderer.js"></script>
  </body>
</html>
